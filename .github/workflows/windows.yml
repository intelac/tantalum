name: Windows

# 在真实的 Windows（windows-latest）上跑全部测试（windows-server N14）。
# 不用任何密钥：不引用仓库密钥，仓库只读，检出后不留令牌，只用 push、pull_request、workflow_dispatch 三种触发。
# 真实模型的冒烟测试要 TANTALUM_SMOKE_* 和 API 密钥，这里都没有，所以不会打开。

# 只在动了和平台有关的代码时跑（Yi 2026-11-14 定）：Java 的纯逻辑在 macOS 上测过就够了，Windows 上出问题的是 shell（PowerShell）、
# 文件系统（路径、权限、文件被占用）、进程和服务器在 Windows 上的启动、数据目录、journal 文件。只改服务器的其余部分、控制台、
# 文档时不跑。要手动跑一次：Actions 页面上的 “Run workflow”（workflow_dispatch）。
on:
  push:
    branches: [main, windows-server]
    paths:
      - 'tantalum-local/**'
      - 'tantalum-connect/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/journal/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/boot/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/store/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/attachment/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/local/**'
      - 'tantalum-shell/src/test/java/tantalum/shell/journal/WindowsFilesTest.java'
      - 'tantalum-shell/src/test/java/tantalum/shell/boot/DataDirCheckTest.java'
      - '**/pom.xml'
      - 'docs/windows/**'
      - '.github/**'
  pull_request:
    paths:
      - 'tantalum-local/**'
      - 'tantalum-connect/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/journal/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/boot/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/store/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/attachment/**'
      - 'tantalum-shell/src/main/java/tantalum/shell/local/**'
      - 'tantalum-shell/src/test/java/tantalum/shell/journal/WindowsFilesTest.java'
      - 'tantalum-shell/src/test/java/tantalum/shell/boot/DataDirCheckTest.java'
      - '**/pom.xml'
      - 'docs/windows/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25.6.0'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Console build and unit tests
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # 测试文件一个一个跑：ModelPicker 的“200 个模型 100 ms 内打开”是 jsdom 粗测，runner 上并行的测试文件抢 CPU 时
          # 量到 65–100.6 ms（6 次运行），不是控件慢；断言不改
          pnpm test --no-file-parallelism
      - name: Package
        # 控制台的计时测试偶尔在 runner 上超时（ModelPicker 的 100 ms，2026-11-14/15 两次 106–108 ms）：它失败时 Java 照样要跑，
        # 不然这次推送真正要验证的平台代码一个测试都没跑（断言不改，见上一步的注释）
        if: success() || failure()
        run: mvn -B -ntp package "-DskipTests"
      - name: Maven verify
        if: success() || failure()
        # 覆盖率门槛留在 macOS 的全量回归上：bash 的边界这类只在 macOS、Linux 跑的代码在这里跳过，比例会偏低（设计“windows.yml”）。
        run: mvn -B -ntp verify "-Djacoco.haltOnFailure=false"
      - name: PowerShell, browser host and Windows-only tests were not skipped
        if: success() || failure()
        # runner 上装着 Node.js 和 Edge、Chrome：真的 Playwright MCP 也在这里跑（connector-jar）
        run: |
          ./.github/scripts/assert-not-skipped.ps1 LocalShellIT PlaywrightHostIT PlaywrightMcpIT WindowsFilesTest DataDirCheckTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 检查本身也要会失败：一个没跑过的类名必须让它退出码 1
          ./.github/scripts/assert-not-skipped.ps1 NoSuchTest
          if ($LASTEXITCODE -ne 1) { throw "assert-not-skipped.ps1 passed a class that never ran" }
          exit 0
      - name: Jar, connector and data directory smoke
        if: success() || failure()
        # 设计“手工检查”里 CI 能做的部分：中文密码登录、重启后都还在、check、连接程序连上和被撤销、D:\ 下的 WARN 和 icacls、UNC 拒绝
        run: |
          mvn -B -ntp -q -pl tantalum-connect -am package "-DskipTests" "-Djacoco.skip=true"
          $connector = (Resolve-Path tantalum-connect\target\tantalum-connect-0.1.0-all.jar).Path
          ./.github/scripts/windows-smoke.ps1 -Jar tantalum-shell\target\tantalum-shell-0.1.0-exec.jar -ConnectorJar $connector
      - name: Scheduled task
        if: success() || failure()
        run: ./docs/windows/tantalum-task.ps1 selftest -Jar tantalum-shell\target\tantalum-shell-0.1.0-exec.jar
      - name: Console end-to-end
        if: success() || failure()
        working-directory: console
        run: |
          pnpm exec playwright install chromium
          pnpm e2e
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            console/test-results/
          retention-days: 7
