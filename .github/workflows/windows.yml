name: Windows

# 在真实的 Windows（windows-latest）上跑全部测试（windows-server N14）。
# 不用任何密钥：不引用仓库密钥，仓库只读，检出后不留令牌，只用 push、pull_request、workflow_dispatch 三种触发。
# 真实模型的冒烟测试要 TANTALUM_SMOKE_* 和 API 密钥，这里都没有，所以不会打开。

on:
  push:
    branches: [main, windows-server]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.7.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '25.6.0'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Console build and unit tests
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Package
        run: mvn -B -ntp package "-DskipTests"
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\ms-playwright
          key: ms-playwright-java-1.64.0-windows
      - name: Install Chromium
        run: java -jar tantalum-shell\target\tantalum-shell-0.1.0-SNAPSHOT-exec.jar browser install
      - name: Maven verify
        # 覆盖率门槛留在 macOS 的全量回归上：MXC 这类 macOS 连接程序的代码在这里跳过，比例会偏低（设计“windows.yml”）。
        run: mvn -B -ntp verify "-Djacoco.haltOnFailure=false"
      - name: Browser tests and Windows-only tests were not skipped
        if: success() || failure()
        run: |
          ./.github/scripts/assert-not-skipped.ps1 UserBrowserIT BrowserToolsIT WindowsFilesTest DataDirCheckTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 检查本身也要会失败：一个没跑过的类名必须让它退出码 1
          ./.github/scripts/assert-not-skipped.ps1 NoSuchTest
          if ($LASTEXITCODE -ne 1) { throw "assert-not-skipped.ps1 passed a class that never ran" }
          exit 0
      - name: Jar, connector and data directory smoke
        if: success() || failure()
        # 设计“手工检查”里 CI 能做的部分：中文密码登录、重启后都还在、check、连接程序连上和被撤销、D:\ 下的 WARN 和 icacls、UNC 拒绝
        run: |
          mvn -B -ntp -q -pl tantalum-connect -am package dependency:build-classpath "-DskipTests" "-Djacoco.skip=true" "-Dmdep.outputFile=$env:RUNNER_TEMP\connect-cp.txt" "-Dmdep.includeScope=runtime"
          $cp = (Resolve-Path tantalum-connect\target\tantalum-connect-0.1.0-SNAPSHOT.jar).Path + ';' + (Get-Content -Raw "$env:RUNNER_TEMP\connect-cp.txt").Trim()
          ./.github/scripts/windows-smoke.ps1 -Jar tantalum-shell\target\tantalum-shell-0.1.0-SNAPSHOT-exec.jar -ConnectorClasspath $cp
      - name: Scheduled task
        if: success() || failure()
        run: ./docs/windows/tantalum-task.ps1 selftest -Jar tantalum-shell\target\tantalum-shell-0.1.0-SNAPSHOT-exec.jar
      - name: Console end-to-end
        if: success() || failure()
        working-directory: console
        run: |
          pnpm exec playwright install chromium
          pnpm e2e
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            console/test-results/
          retention-days: 7
