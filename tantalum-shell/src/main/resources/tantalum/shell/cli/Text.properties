# tantalum command-line text: English (the base bundle). Placeholders are {name}; no MessageFormat quoting.
users.usage=usage: users add|reset|disable <name> [--lang zh|en|ja]   (password is read from standard input)
users.password.required=password is required
users.done=done: {action} {name}
users.bad.name=user name may only contain a-z, 0-9, - and _: {name}
users.reserved.name={name} is reserved by Windows and cannot be a user name.
users.exists=user already exists: {name}
users.no.such=no such user: {name}
check.different=DIFFERENT {problem}
check.all.ok=all {sessions} sessions replay to their recorded results
check.some.differ={count} of {sessions} sessions differ from their recorded results
check.failed=check failed: {detail}
browser.usage=usage: browser install [--with-deps] [--lang zh|en|ja]
browser.installing=Installing Chromium headless shell for Playwright {version} ...
browser.done=done in {seconds} s
browser.failed=the installer exited with code {code}
browser.with.deps.ignored=--with-deps installs Linux system libraries; it is not needed on Windows and is ignored.
data.dir.network.share=The data directory {dir} is on a network share. SQLite cannot keep the index consistent there; use a local disk.
data.dir.outside.profile=The data directory {dir} is outside your user profile ({home}), so other users of this computer may be able to read it. To limit it to you, SYSTEM and Administrators, run:\n  {command}
data.dir.no.acl=The data directory {dir} is on a volume without file permissions (FAT32 or exFAT), so anyone using this computer can read it. Use an NTFS volume.
