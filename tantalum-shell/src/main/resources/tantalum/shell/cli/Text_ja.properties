# tantalum command-line text：日本語。プレースホルダー {name} は英語版と同じです。
users.usage=使い方：users add|reset|disable <ユーザー名> [--lang zh|en|ja]   （パスワードは標準入力から読みます）
users.password.required=パスワードが必要です。標準入力から 1 行で渡してください
users.done=完了：{action} {name}
users.bad.name=ユーザー名に使えるのは a-z、0-9、-、_ だけです：{name}
users.exists=ユーザーはすでに存在します：{name}
users.no.such=そのユーザーはいません：{name}
check.different=不一致 {problem}
check.all.ok={sessions} 件のセッションすべてで、再生結果が記録と一致しました
check.some.differ={sessions} 件のセッションのうち {count} 件が記録と一致しません
check.failed=チェックに失敗しました：{detail}
browser.usage=使い方：browser install [--with-deps] [--lang zh|en|ja]
browser.installing=Playwright {version} 用の Chromium headless shell をインストールしています…
browser.done=完了（{seconds} 秒）
browser.failed=インストーラーが終了コード {code} で終了しました
