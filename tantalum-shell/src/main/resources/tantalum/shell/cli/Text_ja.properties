# tantalum command-line text：日本語。プレースホルダー {name} は英語版と同じです。
users.usage=使い方：users add [--admin]|reset|disable|enable|admin|user <ユーザー名> | users list   [--lang zh|en|ja]   （パスワードは標準入力から読みます）
users.password.required=パスワードが必要です。標準入力から 1 行で渡してください
users.password.too.short=パスワードは {min} 文字以上にしてください
users.done=完了：{action} {name}
users.bad.name=ユーザー名に使えるのは a-z、0-9、-、_ だけです：{name}
users.reserved.name={name} は Windows の予約済みデバイス名なので、ユーザー名にできません。
users.exists=ユーザーはすでに存在します：{name}
users.last.admin={name} は最後の管理者なので、停止も降格もできません
users.list.header=ユーザー名\t役割\t状態\t作成日時
users.no.such=そのユーザーはいません：{name}
check.different=不一致 {problem}
check.all.ok={sessions} 件のセッションすべてで、再生結果が記録と一致しました
check.some.differ={sessions} 件のセッションのうち {count} 件が記録と一致しません
check.failed=チェックに失敗しました：{detail}
browser.usage=使い方：browser install [--with-deps] [--lang zh|en|ja]
browser.installing=Playwright {version} 用の Chromium headless shell をインストールしています…
browser.done=完了（{seconds} 秒）
browser.failed=インストーラーが終了コード {code} で終了しました
browser.with.deps.ignored=--with-deps は Linux のシステムライブラリを入れるためのものです。Windows では不要なので無視します。
data.dir.network.share=データディレクトリ {dir} はネットワーク共有上にあります。SQLite はそこではインデックスの整合性を保てません。ローカルディスクを使ってください。
data.dir.outside.profile=データディレクトリ {dir} はユーザープロファイル（{home}）の外にあるため、このコンピューターの他のユーザーが読める可能性があります。あなた、SYSTEM、Administrators だけに制限するには次を実行してください：\n  {command}
data.dir.no.acl=データディレクトリ {dir} はファイルのアクセス許可がないボリューム（FAT32 または exFAT）にあるため、このコンピューターを使う誰でも読めます。NTFS ボリュームを使ってください。
