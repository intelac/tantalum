# tantalum command-line text：中文。占位符写 {name}，和英文那份相同。
users.usage=用法：users add [--admin]|reset|disable|enable|admin|user <用户名> | users list   [--lang zh|en|ja]   （密码从标准输入读）
users.password.required=需要密码：从标准输入给一行密码
users.password.too.short=密码至少 {min} 个字符
users.done=完成：{action} {name}
users.bad.name=用户名只能用 a-z、0-9、- 和 _：{name}
users.reserved.name={name} 是 Windows 保留的设备名，不能做用户名。
users.exists=用户已经存在：{name}
users.last.admin={name} 是最后一个管理员，不能停用或取消
users.list.header=用户名\t角色\t状态\t创建时间
users.no.such=没有这个用户：{name}
check.different=不一致 {problem}
check.all.ok=全部 {sessions} 个会话重放的结果和记录的一致
check.some.differ={sessions} 个会话里有 {count} 个和记录的结果不一致
check.failed=检查失败：{detail}
browser.usage=用法：browser install [--with-deps] [--lang zh|en|ja]
browser.installing=正在为 Playwright {version} 安装 Chromium headless shell …
browser.done=完成，用时 {seconds} 秒
browser.failed=安装程序退出，退出码 {code}
browser.with.deps.ignored=--with-deps 是给 Linux 装系统库的，Windows 上不需要，已忽略。
data.dir.network.share=数据目录 {dir} 在网络共享上。SQLite 在那里保证不了索引一致；请用本地磁盘。
data.dir.outside.profile=数据目录 {dir} 不在你的用户目录（{home}）下，这台电脑上的其他用户可能读得到。只给你、SYSTEM 和管理员，运行：\n  {command}
data.dir.no.acl=数据目录 {dir} 所在的卷没有文件权限（FAT32 或 exFAT），用这台电脑的人都能读。请用 NTFS 卷。
