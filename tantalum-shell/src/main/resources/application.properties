spring.threads.virtual.enabled=true
server.address=127.0.0.1
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=12h

tantalum.data-dir=${user.home}/.local/share/tantalum
tantalum.workspace=${user.home}/.local/share/tantalum/workspaces
tantalum.workspace-mode=per-user
tantalum.system-prompt=You are a helpful agent. Use the available tools when they help.
tantalum.tool-timeout=60s
tantalum.provider=claude

# 每用户长期记忆的上限；超限时 memory_write 被拒，不自动整理。
tantalum.memory.max-entries=200
tantalum.memory.max-index-bytes=16384
tantalum.memory.max-entry-bytes=8192
# 共享知识层：管理员维护的只读目录，其中的 *.md 进所有用户的 system；留空表示没有。
tantalum.knowledge.dir=
tantalum.knowledge.max-bytes=65536

tantalum.loop.max-active-runs=64
tantalum.loop.max-parallel-tools=10
tantalum.loop.max-user-in-flight=8
tantalum.loop.max-external-in-flight=256
tantalum.loop.input-ring-size=1024
tantalum.loop.output-ring-size=1024

tantalum.claude.model=claude-sonnet-5-5
tantalum.claude.max-tokens=64000
tantalum.claude.effort=medium
tantalum.claude.fallbacks=true
tantalum.claude.first-chunk-timeout=300s
tantalum.claude.between-chunk-timeout=300s
tantalum.claude.concurrency=4
# 上下文窗口只用于控制台显示占比，不参与截断。
tantalum.claude.context-window=200000

tantalum.openai.base-url=http://127.0.0.1:8090/v1
tantalum.openai.model=qwen3.8-flash-next-unsloth-ud-q4_k_xl
tantalum.openai.max-tokens=16384
tantalum.openai.first-chunk-timeout=300s
tantalum.openai.between-chunk-timeout=60s
tantalum.openai.concurrency=1
tantalum.openai.context-window=131072
