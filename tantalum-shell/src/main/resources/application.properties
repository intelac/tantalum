spring.threads.virtual.enabled=true
server.address=127.0.0.1
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=12h
# 关闭时等已接受的请求处理完。
server.shutdown=graceful

tantalum.data-dir=${user.home}/.local/share/tantalum
tantalum.workspace=${user.home}/.local/share/tantalum/workspaces
tantalum.workspace-mode=per-user
tantalum.system-prompt=You are a helpful agent. Use the available tools when they help.
tantalum.tool-timeout=60s

# 每用户长期记忆的上限；超限时 memory_write 被拒，不自动整理。
tantalum.memory.max-entries=200
tantalum.memory.max-index-bytes=16384
tantalum.memory.max-entry-bytes=8192
# 共享知识层：管理员维护的只读目录，其中的 *.md 进所有用户的 system；留空表示没有。
tantalum.knowledge.dir=
tantalum.knowledge.max-bytes=65536

# 新会话等 MCP 服务器第一次连接的上限；超时后缺的工具要到新会话才可见。
tantalum.mcp.startup-wait=10s

# 上下文压缩（规则见 context-compaction spec）。窗口按模型取，阈值 = 窗口 − max(reserve-tokens, 该路线的 max-tokens)。
tantalum.compaction.reserve-tokens=16384
tantalum.compaction.keep-recent-tokens=20000
tantalum.compaction.max-kept-tool-result-bytes=32768
tantalum.compaction.max-summarized-tool-result-bytes=4096
tantalum.compaction.summary-max-tokens=8192
# 向模型读上下文窗口（Claude 的 Models 接口、本地服务的 /models）；false 时只用各路线的 context-window。
tantalum.compaction.window-from-model=true

# 索引库的节流。运行结束总是写，其余攒够事件数或到时间才写。
tantalum.index.flush-events=200
tantalum.index.flush-interval=5s

# 常驻会话：没有运行的会话空闲这么久、或常驻数超过上限时移出内存，下次打开从文件载入。
tantalum.residency.idle=30m
tantalum.residency.max-resident=1000
tantalum.residency.sweep-interval=1s
# 会话载入失败后多久再试（之前拒绝，回 500）
tantalum.residency.load-retry=1m

# 附件的上限（attachments spec，A4、A5）。图片照 DSH 的默认值；文件、配额是多用户服务器自定的。
tantalum.attachments.max-images-per-message=20
tantalum.attachments.max-image-bytes-per-message=209715200
tantalum.attachments.max-image-bytes=52428800
tantalum.attachments.max-image-pixels=64000000
tantalum.attachments.max-image-edge=65535
tantalum.attachments.max-files-per-message=20
tantalum.attachments.max-file-bytes=52428800
# 每个用户存储的附件合计（5 GiB）。
tantalum.attachments.quota-bytes=5368709120
# 同时规范化的图片数，多出的排队，等待时间计入上传请求。
tantalum.attachments.normalize-concurrency=2

# 钩子在同一个等待点连续要求工作的最多轮数，超过时运行以失败结束；小于 1 时拒绝启动。
tantalum.hooks.max-work-rounds=8
# 管理员设成必须开启的插件，逗号分隔（如 dailyQuota）：所有用户都开着、插件页上不能关、钩子出错按拦截处理。名字不认识时拒绝启动。
tantalum.hooks.required=

# 联网（web-tools spec）。内网默认拦（多用户的服务器一个用户就能让 agent 扫内网、拿云元数据凭据）：回环、私网、运营商级 NAT、
# 链路本地（含云服务器元数据地址）和 0.0.0.0（W6）。单人用、要抓内网页面时改成 false。服务器自己的端口不论开关永远拦。
tantalum.web.block-private-network=true
tantalum.web.fetch.enabled=true
tantalum.web.browser.enabled=true
# 同时开着的浏览器（每个用户一个）上限，满了新用户得到“都在用”；每个约 150–300 MB。
tantalum.web.browser.max-open=4
tantalum.web.browser.idle-close=10m
# Chromium 渲染进程的沙箱。关掉后，网页里的浏览器漏洞能直接拿到 Tantalum 进程的权限。
tantalum.web.browser.sandbox=true

tantalum.loop.max-active-runs=64
tantalum.loop.max-parallel-tools=10
tantalum.loop.max-user-in-flight=8
tantalum.loop.max-external-in-flight=256
tantalum.loop.input-ring-size=1024
tantalum.loop.output-ring-size=1024
# 每个用户在途事件的上限（默认 input-ring-size 的四分之一）：一个用户的事件再多也只拖慢自己
tantalum.loop.max-user-permits=256

# 模型路线（model-picker spec）。默认路线：新会话、没选过模型的用户用它的默认模型和默认档位（M7）。
tantalum.provider=claude
# Claude 路线：默认模型和默认档位（low、medium、high、xhigh、max）。
tantalum.claude.model=claude-sonnet-5-5
tantalum.claude.max-tokens=64000
tantalum.claude.effort=medium
# 存密钥的环境变量名；密钥本身不写在这里。
tantalum.claude.api-key-env=ANTHROPIC_API_KEY
# 允许列表，逗号分隔；空 = Models 接口里支持 adaptive 思考的全部。
tantalum.claude.models=
tantalum.claude.display-name=Claude
tantalum.claude.fallbacks=true
tantalum.claude.first-chunk-timeout=300s
tantalum.claude.between-chunk-timeout=300s
tantalum.claude.concurrency=4
# 上下文窗口：启动时和每 10 分钟从 Models 接口读，读不到才用这个值；0 表示未知，不压缩（compaction-threshold）。
# 压缩点 = min(窗口 × 用户在设置页选的百分比, 窗口 − max(reserve-tokens, max-tokens))。
tantalum.claude.context-window=200000
# 估算 token 数时用的“每 token 字节数”，宁可多算。claude-sonnet-5-5 实测：Java 2.67、中文 2.25、英文 1.82、JSON 1.80。
tantalum.claude.bytes-per-token=1.5

# OpenAI 兼容路线，要几条写几条，名字只用小写字母、数字、-。没写的项见 README“模型路线”。例：本机 llama.cpp 跑 qwen。
#tantalum.openai-routes.local.display-name=本地
#tantalum.openai-routes.local.base-url=http://127.0.0.1:8090/v1
#tantalum.openai-routes.local.model=qwen3.8-flash-next-unsloth-ud-q4_k_xl
# 思考参数的写法：none（默认，没有档位）、reasoning-effort、enable-thinking、chat-template、thinking-type。
#tantalum.openai-routes.local.thinking=chat-template
# 从 {base-url}/models 读窗口（llama.cpp 的 meta.n_ctx、vLLM 的 max_model_len 或 context_length），读不到才用这个值。
#tantalum.openai-routes.local.context-window=131072
# 本地 qwen 实测每 token 字节数：Java 4.28、中文 4.84、英文 3.36、JSON 1.89（带 id 和哈希的轨迹）到 2.21。
#tantalum.openai-routes.local.bytes-per-token=1.75
#tantalum.openai-routes.local.concurrency=1
# 存密钥的环境变量名，本机服务不要密钥就不写（不发认证头）。
#tantalum.openai-routes.kimi.api-key-env=KIMI_API_KEY
# 关闭时等在途的模型和工具调用最多多久，到时中断，被中断的运行下次启动时收尾。
tantalum.shutdown-wait=30s
