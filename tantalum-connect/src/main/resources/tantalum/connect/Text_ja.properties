refused.no.token=トークンがありません。Web ページで発行したトークンを環境変数 {variable} に入れてから起動してください。
refused.not.a.token=Tantalum のトークンではないようです（{prefix} で始まるはずです）。Web のプラグインページからもう一度コピーしてください。
refused.browser.choice=--browser は chrome か edge のどちらかです：{value}
refused.browser.needs.allow={option} は --allow-browser と一緒に指定してください。
refused.browser.path=--browser-path のファイルが存在しないか、実行できません：{path}
refused.browser.profile=ブラウザーのプロファイルディレクトリを使えません：{dir}（{detail}）
