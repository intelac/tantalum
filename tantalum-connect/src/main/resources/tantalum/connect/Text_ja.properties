# tantalum-connect terminal text：日本語。プレースホルダー {name} は英語版と同じです。
help=使い方：tantalum-connect --allow ディレクトリ [--allow ディレクトリ ...] [オプション]\n\
\n\
このコンピューターの許可したディレクトリを、Tantalum サーバー上の agent に使わせます。トークンは\n\
Web のプラグインページで発行し、起動前に環境変数 TANTALUM_TOKEN に入れるか、起動後に案内に従って\n\
貼り付けてください（表示されません）。トークンをコマンドラインに書かないでください。\n\
\n\
\  --server URL          サーバーのアドレス。既定は http://127.0.0.1:8091\n\
\  --allow ディレクトリ  agent が使えるディレクトリ。複数指定でき、最初のものがメインです（1 つ以上）。\n\
\                        . は現在のディレクトリです。先にプロジェクトへ cd してから --allow . と書きます。\n\
\                        ホームディレクトリと / は指定できません\n\
\  --allow-write         ファイルの変更を許可します（write_file、edit_file）。付けなければ読み取りのみです\n\
\  --allow-shell         コマンドの実行を許可します（bash、システムのサンドボックス内で実行）\n\
\  --allow-read ディレクトリ  コマンドが追加で読めるディレクトリ。複数指定できます\n\
\  --env 名前            この環境変数をコマンドに渡します。複数指定できます。\n\
\                        名前に KEY、TOKEN、SECRET、PASSWORD を含むものは渡せません\n\
\  --no-network          コマンドはネットワークに接続できません\n\
\  --name 名前           Web ページに表示するコンピューター名。既定はホスト名です\n\
\  --mxc パス            MXC サンドボックスプログラム mxc-exec-mac の場所\n\
\  --lang 言語           このターミナルのメッセージの言語：zh、en、ja。既定はシステムに合わせます\n\
\  --help                この説明を表示します\n\
\n\
リスク：サーバー側の agent は許可したディレクトリ内のすべてのファイルを読めます。--allow-write を付けると、\n\
変更や削除もできます。操作のたびにこのターミナルに 1 行記録します。Ctrl+C で切断します。\n\
\n\
終了コード：1 起動オプションが正しくない。2 サーバーが接続を拒否または終了した（トークンが無効、期限切れ、\n\
取り消し、または別のコンピューターに置き換えられた）。\n
refused.token.on.command.line=トークンをコマンドラインに書かないでください。同じコンピューターの他のプログラムからコマンドライン引数が見えます。環境変数 {variable} を使うか、トークンなしで起動して案内に従って貼り付けてください。
refused.unknown.option=不明なオプションです：{option}。--help ですべてのオプションを確認できます。
refused.no.allow=--allow でディレクトリを 1 つ以上指定してください。例：--allow ~/work/shop。--help ですべてのオプションを確認できます。
refused.missing.value={option} の後に値が必要です。
refused.allow.not.dir=--allow のディレクトリが存在しないか、ディレクトリではありません：{dir}
refused.allow.unusable=--allow のディレクトリを使えません：{detail}
refused.read.not.dir=--allow-read のディレクトリが存在しないか、ディレクトリではありません：{dir}
refused.env.secret=--env で {name} は渡せません。名前に KEY、TOKEN、SECRET、PASSWORD を含む変数は秘密情報の可能性があるため、コマンドに渡しません。
refused.env.name=--env には環境変数の名前（英字、数字、アンダースコア）を書きます。値は書きません：{name}
refused.root=--allow にルートディレクトリ / は指定できません。agent がこのコンピューターのすべてのファイルを読めてしまいます。--allow ~/work/shop のようにプロジェクトのディレクトリを指定するか、プロジェクトへ cd してから --allow . を使ってください（. は現在のディレクトリです）。
refused.home=--allow にホームディレクトリ {dir} は指定できません。鍵（~/.ssh や .env など）、ブラウザーのデータ、他のプロジェクトがあり、agent がすべて読めてしまいます。--allow {example} のようにプロジェクトのディレクトリを指定するか、プロジェクトへ cd してから --allow . を使ってください（. は現在のディレクトリです）。
refused.server.scheme=--server は http:// または https:// で始めてください：{server}
refused.server.address=--server のアドレスが正しくありません：{server}
token.prompt=Web ページで発行したトークンを貼り付けて（表示されません）、Enter を押してください：
refused.no.token=トークンがありません。Web ページで発行したトークンを環境変数 {variable} に入れてから起動してください。
refused.not.a.token=Tantalum のトークンではないようです（{prefix} で始まるはずです）。Web のプラグインページからもう一度コピーしてください。
