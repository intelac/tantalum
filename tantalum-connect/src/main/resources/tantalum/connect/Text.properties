# tantalum-connect terminal text: English (the base bundle). Placeholders are {name}; no MessageFormat quoting.
help=Usage: tantalum-connect --allow DIR [--allow DIR ...] [options]\n\
\n\
Lets the agent on a Tantalum server use the allowed directories on this computer. Create a token\n\
on the Plugins page, then put it in the TANTALUM_TOKEN environment variable before starting, or\n\
paste it when asked (it is not shown). Never put the token on the command line.\n\
\n\
\  --server URL      Server address, default http://127.0.0.1:8091\n\
\  --allow DIR       A directory the agent may use. Repeat for more; the first is the main one (at least one).\n\
\                    . is the current directory: cd to the project first, then use --allow .\n\
\                    Your home directory and / are not allowed\n\
\  --allow-write     Allow changing files (write_file, edit_file). Without it, read only\n\
\  --allow-shell     Allow running commands (bash, in the system sandbox)\n\
\  --allow-read DIR  An extra directory commands may read. Repeat for more\n\
\  --env NAME        Pass this environment variable to commands. Repeat for more;\n\
\                    names containing KEY, TOKEN, SECRET or PASSWORD are refused\n\
\  --no-network      Commands cannot use the network\n\
\  --insecure        Allow a plain http:// server that is not on this computer (the token travels unencrypted)\n\
\  --name NAME       Computer name shown on the web page, default the host name\n\
\  --mxc PATH        Where the MXC sandbox program mxc-exec-mac is\n\
\  --lang LANG       Language of the messages here: zh, en or ja. Default follows the system\n\
\  --help            Show this help\n\
\n\
Risk: the agent on the server can read every file in the allowed directories; with --allow-write\n\
it can also change and delete them. Every action prints one line in this terminal. Press Ctrl+C to disconnect.\n\
\n\
Exit codes: 1 bad options; 2 the server refused or ended the connection (token invalid, expired,\n\
revoked, or replaced by another computer).\n
refused.token.on.command.line=Don't put the token on the command line: other programs on this computer can see command-line arguments. Use the {variable} environment variable instead, or start without the token and paste it when asked.
refused.unknown.option=Unknown option: {option}. Run with --help to see all options.
refused.no.allow=Give at least one directory with --allow, for example --allow ~/work/shop. Run with --help to see all options.
refused.missing.value={option} needs a value.
refused.allow.not.dir=The --allow directory does not exist or is not a directory: {dir}
refused.allow.unusable=The --allow directory cannot be used: {detail}
refused.read.not.dir=The --allow-read directory does not exist or is not a directory: {dir}
refused.env.secret=--env cannot pass {name}: variables whose names contain KEY, TOKEN, SECRET or PASSWORD may be secrets and are not given to commands.
refused.env.name=--env takes the name of an environment variable (letters, digits, underscores), not its value: {name}
refused.root=--allow cannot be the root directory /: the agent could read every file on this computer. Use a project directory instead, for example --allow ~/work/shop, or cd to the project and use --allow . (. is the current directory).
refused.home=--allow cannot be your home directory {dir}: it holds keys (such as ~/.ssh and .env), browser data and other projects, and the agent could read all of them. Use a project directory instead, for example --allow {example}, or cd to the project and use --allow . (. is the current directory).
refused.server.scheme=--server must start with http:// or https://: {server}
refused.server.address=The --server address is not valid: {server}
refused.server.insecure=--server {server} is not on this computer and not https://; the token would travel unencrypted. Use https://, or give --insecure if you accept that.
token.prompt=Paste the token from the web page (not shown) and press Enter: 
refused.no.token=No token. Put the token from the web page in the {variable} environment variable and start again.
refused.not.a.token=This doesn't look like a Tantalum token (it should start with {prefix}). Copy it again from the Plugins page.
