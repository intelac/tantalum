# tantalum-connect terminal text: English (the base bundle). Placeholders are {name}; no MessageFormat quoting.
help=Usage: tantalum-connect --allow DIR [--allow DIR ...] [options]\n\
\n\
Lets the agent on a Tantalum server use the allowed directories on this computer. Create a token\n\
on the Plugins page, then put it in the TANTALUM_TOKEN environment variable before starting, or\n\
paste it when asked (it is not shown). Never put the token on the command line.\n\
\n\
\  --server URL      Server address, default http://127.0.0.1:8091\n\
\  --allow DIR       A directory the agent may use. Repeat for more; the first is the main one (at least one).\n\
\                    . is the current directory: cd to the project first, then use --allow .\n\
\                    Your home directory and / are not allowed\n\
\  --allow-write     Allow changing files (write_file, edit_file). Without it, read only\n\
\  --allow-shell     Allow running commands (bash on macOS and Linux, PowerShell on Windows). There is no\n\
\                    sandbox: commands run as you and can reach every file your account can. By default\n\
\                    each command is shown to you on the web page for approval first\n\
\  --env NAME        Commands and local MCP servers normally do not get variables whose names look like\n\
\                    secrets (KEY, TOKEN, SECRET, PASSWORD); the ones named here are passed anyway. Repeat for more\n\
\  --allow-browser   Allow a browser on this computer: your installed Chrome or Edge, driven by a local\n\
\                    Playwright MCP server (needs Node.js), with a profile of its own\n\
\  --browser NAME    Which browser: chrome or edge. Default: Chrome if installed, otherwise Edge\n\
\  --browser-path FILE     The browser program to use, if it is installed somewhere unusual\n\
\  --browser-headless      Do not show the browser window\n\
\  --browser-profile DIR   Where the browser keeps its logins. Default: a directory of the connector\n\
\  --insecure        Allow a plain http:// server that is not on this computer (the token travels unencrypted)\n\
\  --name NAME       Computer name shown on the web page, default the host name\n\
\  --mcp-config FILE Local MCP servers (mcpServers format, as in Claude Desktop). Defaults to\n\
\                    ~/.config/tantalum/mcp.json, or %APPDATA%\\tantalum\\mcp.json on Windows. They start on this\n\
\                    computer and their tools are given to the agent\n\
\  --lang LANG       Language of the messages here: zh, en or ja. Default follows the system\n\
\  --help            Show this help\n\
\n\
Risk: the agent on the server can read every file in the allowed directories; with --allow-write\n\
it can also change and delete them. With --allow-shell it can run commands as you (by default each one is\n\
shown to you on the web page first). With --allow-browser it can open and act on any web page as you, on sites\n\
you have logged in to in that browser, and what the pages show is sent to the server and the model.\n\
Every action prints one line in this terminal. Press Ctrl+C to disconnect.\n\
\n\
Exit codes: 1 bad options; 2 the server refused or ended the connection (token invalid, expired,\n\
revoked, or replaced by another computer).\n
refused.token.on.command.line=Don't put the token on the command line: other programs on this computer can see command-line arguments. Use the {variable} environment variable instead, or start without the token and paste it when asked.
refused.unknown.option=Unknown option: {option}. Run with --help to see all options.
refused.no.allow=Give at least one directory with --allow, for example --allow ~/work/shop. Run with --help to see all options.
refused.missing.value={option} needs a value.
refused.allow.not.dir=The --allow directory does not exist or is not a directory: {dir}
refused.allow.unusable=The --allow directory cannot be used: {detail}
refused.env.secret=--env cannot pass {name}: the connector's token is never given to commands.
refused.env.name=--env takes the name of an environment variable (letters, digits, underscores), not its value: {name}
refused.root=--allow cannot be the root directory /: the agent could read every file on this computer. Use a project directory instead, for example --allow ~/work/shop, or cd to the project and use --allow . (. is the current directory).
refused.home=--allow cannot be your home directory {dir}: it holds keys (such as ~/.ssh and .env), browser data and other projects, and the agent could read all of them. Use a project directory instead, for example --allow {example}, or cd to the project and use --allow . (. is the current directory).
refused.server.scheme=--server must start with http:// or https://: {server}
refused.server.address=The --server address is not valid: {server}
refused.server.insecure=--server {server} is not on this computer and not https://; the token would travel unencrypted. Use https://, or give --insecure if you accept that.
token.prompt=Paste the token from the web page (not shown) and press Enter: 
refused.no.token=No token. Put the token from the web page in the {variable} environment variable and start again.
refused.not.a.token=This doesn't look like a Tantalum token (it should start with {prefix}). Copy it again from the Plugins page.
refused.browser.choice=--browser must be chrome or edge: {value}
refused.browser.needs.allow={option} only works together with --allow-browser.
refused.browser.path=The --browser-path file does not exist or cannot be run: {path}
refused.browser.profile=The browser profile directory cannot be used: {dir} ({detail})
summary.server=Server: {server}
summary.device=Computer: {name} ({os} {version} {arch})
summary.main.dir=Main directory: {dir}
summary.dir=Allowed directory: {dir}
summary.git.yes=Git queries: available (any repository in the allowed directories, found by path each time)
summary.git.no=Git queries: not available, git is not installed on this computer
summary.write.yes=Change files: allowed
summary.write.no=Change files: not allowed (add --allow-write to allow)
summary.shell.yes=Commands: available, {program}; by default each command is shown to you on the web page for approval first
summary.shell.no=Commands: not available, {reason}
summary.env=Environment variables passed to commands: {names}
summary.browser.no=Browser: not allowed (add --allow-browser to allow)
summary.browser.missing=Browser: not available, Chrome or Edge was not found on this computer. Install one, or point to the program with --browser-path
summary.browser.window=Browser: {name}, with a visible window (opens when the agent first uses it)
summary.browser.headless=Browser: {name}, without a window
summary.browser.profile=Browser profile: {dir} (separate from your everyday browser; delete this directory to clear all its logins)
summary.footer=Every action prints one line below. Press Ctrl+C to disconnect.
link.retry=Cannot reach the server ({cause}); retrying in {seconds} s.
link.shutdown=The server is shutting down; reconnecting in {seconds} s.
link.lost=Connection lost; reconnecting in {seconds} s.
link.bad.token=The token is invalid. Create a new one on the Plugins page.
link.revoked=Revoked on the web page; disconnected.
link.expired=The token has expired. Create a new one on the Plugins page.
link.replaced=Replaced by a connection from another computer; disconnected here.
link.protocol=The server is a different version. Download the new connector.
link.unreadable=The server sent a message this connector cannot read; reconnecting.
link.connected=Connected as {user}; expires at {time}.
shell.not.allowed=--allow-shell was not given
refused.removed.option={option} is no longer supported: commands no longer run in a sandbox, so this limit does not exist. Start again without it.
shell.not.found=Cannot find {shell} on this computer
refused.mcp.config=The --mcp-config file does not exist: {file}
summary.mcp=Local MCP: {names} (config: {file})
summary.mcp.problem=Local MCP config problem: {problem}
