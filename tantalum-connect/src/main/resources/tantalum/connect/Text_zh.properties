# tantalum-connect terminal text：中文。占位符写 {name}，和英文那份相同。
help=用法：tantalum-connect --allow 目录 [--allow 目录 ...] [选项]\n\
\n\
把这台电脑上允许的目录交给 Tantalum 服务器上的 agent 使用。令牌在网页的插件页生成，\n\
启动前放进环境变量 TANTALUM_TOKEN，或者启动后按提示粘贴（不显示）。不要把令牌写在命令行上。\n\
\n\
\  --server URL      服务器地址，默认 http://127.0.0.1:8091\n\
\  --allow 目录      允许 agent 进的目录，可以写多个，第一个是主目录（至少一个）。\n\
\                    . 是当前目录：先 cd 到项目目录再写 --allow .。不能是家目录或 /\n\
\  --allow-write     允许改文件（write_file、edit_file）。不加就只能读\n\
\  --allow-shell     允许跑命令（bash，在系统沙箱里执行）\n\
\  --allow-read 目录 命令额外能读的目录，可以写多个\n\
\  --env 名字        把这个环境变量交给命令，可以写多个；名字里有 KEY、TOKEN、SECRET、PASSWORD 的不行\n\
\  --no-network      命令不能联网\n\
\  --insecure        允许连不在本机的 http:// 服务器（令牌会明文经过网络）\n\
\  --name 名字       在网页上显示的电脑名，默认主机名\n\
\  --mxc 路径        MXC 沙箱程序 mxc-exec-mac 的位置\n\
\  --lang 语言       终端里的提示用哪种语言：zh、en 或 ja，默认跟系统\n\
\  --help            显示这段说明\n\
\n\
风险：服务器那边的 agent 能读允许目录里的所有文件；加了 --allow-write 能改、能删其中的内容。\n\
每个操作都会在这个终端里打一行记录。按 Ctrl+C 断开。\n\
\n\
退出码：1 启动参数不对；2 服务器拒绝或结束了连接（令牌无效、到期、撤销，或被另一台电脑替换）。\n
refused.token.on.command.line=不要把令牌写在命令行上：同一台电脑上的其他程序能看到命令行参数。请改用环境变量 {variable}，或者不带令牌启动，再按提示粘贴。
refused.unknown.option=不认识的参数：{option}。用 --help 查看全部参数。
refused.no.allow=至少要用 --allow 给一个目录，例如 --allow ~/work/shop。用 --help 查看全部参数。
refused.missing.value={option} 后面要跟一个值。
refused.allow.not.dir=--allow 的目录不存在或不是目录：{dir}
refused.allow.unusable=--allow 的目录不能用：{detail}
refused.read.not.dir=--allow-read 的目录不存在或不是目录：{dir}
refused.env.secret=--env 不能放行 {name}：名字里有 KEY、TOKEN、SECRET 或 PASSWORD 的变量可能是密钥，不交给命令。
refused.env.name=--env 后面写环境变量的名字（字母、数字、下划线），不写值：{name}
refused.root=--allow 不能是根目录 /：agent 能读这台电脑上的所有文件。请换成具体的项目目录，例如 --allow ~/work/shop；或者先 cd 到项目目录，再用 --allow .（. 就是当前目录）。
refused.home=--allow 不能是家目录 {dir}：里面有密钥（如 ~/.ssh、.env）、浏览器资料和别的项目，agent 全都能读。请换成具体的项目目录，例如 --allow {example}；或者先 cd 到项目目录，再用 --allow .（. 就是当前目录）。
refused.server.scheme=--server 要以 http:// 或 https:// 开头：{server}
refused.server.address=--server 的地址不对：{server}
refused.server.insecure=--server {server} 不在本机、又不是 https://，令牌会明文经过网络。请用 https://，接受这个风险的话给 --insecure。
token.prompt=粘贴网页上生成的令牌（不显示），按回车：
refused.no.token=没有令牌。请把网页上生成的令牌放进环境变量 {variable} 再启动。
refused.not.a.token=这不像 Tantalum 的令牌（应以 {prefix} 开头）。请在网页的插件页重新复制。
