summary.device=电脑名：{name}（{os} {version} {arch}）
summary.main.dir=主目录：{dir}
summary.dir=允许的目录：{dir}
summary.git.yes=Git 查询：可用（允许目录里的任何仓库，每次按路径找）
summary.git.no=Git 查询：不可用，这台电脑上没有 git
summary.write.yes=改文件：允许
summary.write.no=改文件：不允许（要允许请加 --allow-write）
summary.shell.yes=命令行：可用
summary.shell.no=命令行：不可用，{reason}
summary.sandbox=命令沙箱：{program}
summary.network.yes=命令联网：允许
summary.network.no=命令联网：不允许
summary.read=命令额外能读：{dir}
summary.env=交给命令的环境变量：{names}
summary.footer=每个操作会在下面打一行记录。按 Ctrl+C 断开。
link.retry=连不上服务器（{cause}），{seconds} 秒后重试。
link.shutdown=服务器在关机，{seconds} 秒后重连。
link.lost=连接断开，{seconds} 秒后重连。
link.bad.token=令牌无效。请在网页的插件页重新生成一个令牌。
link.revoked=已在网页上撤销，连接已断开。
link.expired=令牌已到期。请在网页的插件页重新生成一个令牌。
link.replaced=已被另一台电脑的连接替换，这里断开。
link.protocol=服务器版本不同，请下载新的连接程序。
link.unreadable=服务器发来看不懂的消息，断开重连。
