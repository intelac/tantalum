sandbox.mxc.invalid=--mxc 给的 {path} 不存在或不能执行
sandbox.mxc.missing=找不到 MXC 沙箱程序 {program}：请用安装包里的 tantalum-connect 启动，或者用 --mxc 指定它的位置
sandbox.temp.dir=不能准备沙箱用的临时目录：{detail}
sandbox.check.failed=MXC 检查规则没有通过：{detail}
sandbox.start.failed=MXC 不能启动沙箱：{detail}
sandbox.run.failed=MXC 不能运行：{detail}
sandbox.check.interrupted=MXC 的检查被打断了
shell.not.allowed=启动时没有加 --allow-shell
