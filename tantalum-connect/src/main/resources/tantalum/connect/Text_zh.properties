# tantalum-connect terminal text：中文。占位符写 {name}，和英文那份相同。
help=用法：tantalum-connect --allow 目录 [--allow 目录 ...] [选项]\n\
\n\
把这台电脑上允许的目录交给 Tantalum 服务器上的 agent 使用。令牌在网页的插件页生成，\n\
启动前放进环境变量 TANTALUM_TOKEN，或者启动后按提示粘贴（不显示）。不要把令牌写在命令行上。\n\
\n\
\  --server URL      服务器地址，默认 http://127.0.0.1:8091\n\
\  --allow 目录      允许 agent 进的目录，可以写多个，第一个是主目录（至少一个）。\n\
\                    . 是当前目录：先 cd 到项目目录再写 --allow .。不能是家目录或 /\n\
\  --allow-write     允许改文件（write_file、edit_file）。不加就只能读\n\
\  --allow-shell     允许跑命令（macOS、Linux 上 bash，Windows 上 PowerShell）。没有沙箱：命令以你的身份运行，\n\
\                    能碰你的账号能碰的所有文件；每条命令默认先在网页上问你\n\
\  --env 名字        命令和浏览器平时拿不到名字像密钥的环境变量（含 KEY、TOKEN、SECRET、PASSWORD），\n\
\                    写在这里的照样给，可以写多个\n\
\  --allow-browser   允许用这台电脑上的浏览器：已装的 Chrome 或 Edge，由本机的 Playwright MCP 驱动（要装 Node.js）\n\
\  --browser 名字    用哪个浏览器：chrome 或 edge。默认有 Chrome 用 Chrome，没有就用 Edge\n\
\  --browser-path 文件     浏览器程序的位置（装在别处时用）\n\
\  --browser-headless      不显示浏览器窗口\n\
\  --browser-profile 目录  浏览器的登录状态存在哪。默认在连接程序自己的目录里\n\
\  --insecure        允许连不在本机的 http:// 服务器（令牌会明文经过网络）\n\
\  --name 名字       在网页上显示的电脑名，默认主机名\n\
\  --lang 语言       终端里的提示用哪种语言：zh、en 或 ja，默认跟系统\n\
\  --help            显示这段说明\n\
\n\
风险：服务器那边的 agent 能读允许目录里的所有文件；加了 --allow-write 能改、能删其中的内容。\n\
加了 --allow-shell，它能以你的身份运行命令（默认每条先在网页上问你）。\n\
加了 --allow-browser，它能以你的身份打开和操作你在那个浏览器里登录过的网站，页面上的内容会送到服务器和模型。\n\
每个操作都会在这个终端里打一行记录。按 Ctrl+C 断开。\n\
\n\
退出码：1 启动参数不对；2 服务器拒绝或结束了连接（令牌无效、到期、撤销，或被另一台电脑替换）。\n
refused.token.on.command.line=不要把令牌写在命令行上：同一台电脑上的其他程序能看到命令行参数。请改用环境变量 {variable}，或者不带令牌启动，再按提示粘贴。
refused.unknown.option=不认识的参数：{option}。用 --help 查看全部参数。
refused.no.allow=至少要用 --allow 给一个目录，例如 --allow ~/work/shop。用 --help 查看全部参数。
refused.missing.value={option} 后面要跟一个值。
refused.allow.not.dir=--allow 的目录不存在或不是目录：{dir}
refused.allow.unusable=--allow 的目录不能用：{detail}
refused.env.secret=--env 不能放行 {name}：连接程序的令牌不交给命令。
refused.env.name=--env 后面写环境变量的名字（字母、数字、下划线），不写值：{name}
refused.root=--allow 不能是根目录 /：agent 能读这台电脑上的所有文件。请换成具体的项目目录，例如 --allow ~/work/shop；或者先 cd 到项目目录，再用 --allow .（. 就是当前目录）。
refused.home=--allow 不能是家目录 {dir}：里面有密钥（如 ~/.ssh、.env）、浏览器资料和别的项目，agent 全都能读。请换成具体的项目目录，例如 --allow {example}；或者先 cd 到项目目录，再用 --allow .（. 就是当前目录）。
refused.server.scheme=--server 要以 http:// 或 https:// 开头：{server}
refused.server.address=--server 的地址不对：{server}
refused.server.insecure=--server {server} 不在本机、又不是 https://，令牌会明文经过网络。请用 https://，接受这个风险的话给 --insecure。
token.prompt=粘贴网页上生成的令牌（不显示），按回车：
refused.no.token=没有令牌。请把网页上生成的令牌放进环境变量 {variable} 再启动。
refused.not.a.token=这不像 Tantalum 的令牌（应以 {prefix} 开头）。请在网页的插件页重新复制。
refused.browser.choice=--browser 只能是 chrome 或 edge：{value}
refused.browser.needs.allow={option} 要和 --allow-browser 一起用。
refused.browser.path=--browser-path 的文件不存在或不能运行：{path}
refused.browser.profile=浏览器的资料目录不能用：{dir}（{detail}）
summary.server=服务器：{server}
summary.device=电脑名：{name}（{os} {version} {arch}）
summary.main.dir=主目录：{dir}
summary.dir=允许的目录：{dir}
summary.git.yes=Git 查询：可用（允许目录里的任何仓库，每次按路径找）
summary.git.no=Git 查询：不可用，这台电脑上没有 git
summary.write.yes=改文件：允许
summary.write.no=改文件：不允许（要允许请加 --allow-write）
summary.shell.yes=命令行：可用，{program}；每条命令默认先在网页上问你
summary.shell.no=命令行：不可用，{reason}
summary.env=交给命令的环境变量：{names}
summary.browser.no=浏览器：不允许（要允许请加 --allow-browser）
summary.browser.missing=浏览器：不可用，这台电脑上没有找到 Chrome 或 Edge。装一个，或者用 --browser-path 指定程序的位置
summary.browser.window=浏览器：{name}，有窗口（agent 第一次用到时才打开）
summary.browser.headless=浏览器：{name}，不显示窗口
summary.browser.profile=浏览器资料目录：{dir}（和你平时的浏览器分开；删掉这个目录就清空里面全部的登录状态）
summary.footer=每个操作会在下面打一行记录。按 Ctrl+C 断开。
link.retry=连不上服务器（{cause}），{seconds} 秒后重试。
link.shutdown=服务器在关机，{seconds} 秒后重连。
link.lost=连接断开，{seconds} 秒后重连。
link.bad.token=令牌无效。请在网页的插件页重新生成一个令牌。
link.revoked=已在网页上撤销，连接已断开。
link.expired=令牌已到期。请在网页的插件页重新生成一个令牌。
link.replaced=已被另一台电脑的连接替换，这里断开。
link.protocol=服务器版本不同，请下载新的连接程序。
link.unreadable=服务器发来看不懂的消息，断开重连。
link.connected=已连接，用户 {user}，{time} 到期。
shell.not.allowed=启动时没有加 --allow-shell
refused.removed.option={option} 已不再支持：命令不再在沙箱里跑，没有这个限制了。去掉这个参数再启动。
refused.removed.mcp=--mcp-config 已不再支持：连接程序不再启动本机 MCP 服务器。文件、命令、浏览器（--allow-browser）照常能用。去掉这个参数再启动。
shell.not.found=这台电脑上找不到 {shell}
summary.browser.node=浏览器：不可用，这台电脑上没有找到 Node.js（npx）。浏览器由本机的 Playwright MCP 驱动，要先装 Node.js：https://nodejs.org
